    volumes:
      - type: bind
        source: /private/tmp/u1-lunch-bot-storage-961ab998-0b81-444c-ab33-578c76f008c0/mount
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/postgres
        target: /opt/u1/infra/postgres
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db
        target: /opt/u1/db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /private/tmp/u1-lunch-bot-storage-961ab998-0b81-444c-ab33-578c76f008c0/evidence
